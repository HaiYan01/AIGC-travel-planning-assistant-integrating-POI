version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: travel-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-yourpassword}
      MYSQL_DATABASE: travel_planner
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: travel-server
    restart: always
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: mysql://root:${DB_PASSWORD:-yourpassword}@mysql:3306/travel_planner
      JWT_SECRET: ${JWT_SECRET:-your-jwt-secret}
      AI_API_KEY: ${AI_API_KEY}
      AI_API_BASE_URL: ${AI_API_BASE_URL:-https://api.openai.com/v1}
      AI_MODEL: ${AI_MODEL:-gpt-3.5-turbo}
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - ./logs:/app/server/logs

  nginx:
    image: nginx:alpine
    container_name: travel-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ../web/dist:/usr/share/nginx/html:ro
    depends_on:
      - server

volumes:
  mysql_data:
